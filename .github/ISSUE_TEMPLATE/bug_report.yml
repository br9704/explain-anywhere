name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For security problems, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select text in ...
        2. Press Control+Shift+I
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.1, Apple silicon
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you selected text in
      placeholder: Safari, Preview, Xcode, ...
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - ./install.sh from source
        - Prebuilt release app
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error text
      description: Remove anything private from the selection before posting.
